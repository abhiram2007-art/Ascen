name: ascend
description: "ASCEND — Solo Leveling-inspired gamified productivity tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  fl_chart: ^0.70.2
  percent_indicator: ^4.2.3

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.2.1
  google_generative_ai: ^0.4.7
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  connectivity_plus: ^7.3.1
  table_calendar: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.jpg"
